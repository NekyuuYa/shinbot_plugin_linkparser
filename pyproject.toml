[project]
name = "shinbot-plugin-linkparser"
version = "0.3.1"
description = "ShinBot link parser: resolve Bilibili video links / share cards and reply with the playable video."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "bilibili-api-python>=17.4.1,<18.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

# NOTE: Bilibili access strategy = 方案 B (bilibili-api-python, same as
# astrbot_plugin_parser) for metadata / play URLs / login; httpx handles the
# actual video byte download. See DESIGN.md §5.2.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
